<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>

  <!-- Shield icon -->
  <g transform="translate(340, 90)">
    <path d="M50 8 L90 26 L90 62 C90 90 72 114 50 122 C28 114 10 90 10 62 L10 26 Z"
          fill="url(#shield)" opacity="0.9"/>
    <rect x="38" y="52" width="24" height="20" rx="3" fill="#0f172a" opacity="0.7"/>
    <path d="M50 42 A10 10 0 0 1 60 52 L40 52 A10 10 0 0 1 50 42Z"
          fill="none" stroke="#0f172a" stroke-width="3.5" opacity="0.7"/>
    <circle cx="50" cy="65" r="3" fill="#e2e8f0"/>
  </g>

  <!-- "Vaulted" text -->
  <text x="460" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-1">Vaulted</text>

  <!-- Tagline -->
  <text x="462" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8" letter-spacing="0.5">Share secrets that self-destruct</text>
</svg>
